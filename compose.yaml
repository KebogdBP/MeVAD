services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mevad
      POSTGRES_USER: mevad
      POSTGRES_PASSWORD: ${MEVAD_POSTGRES_PASSWORD:-mevad}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mevad -d mevad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - backend

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./deploy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - backend
      - egress

  migrate:
    build: .
    command: ["mevad-migrate"]
    environment:
      MEVAD_DATABASE_URL: postgresql+psycopg://mevad:${MEVAD_POSTGRES_PASSWORD:-mevad}@postgres:5432/mevad
      MEVAD_REQUIRE_MEDIA_TOOLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build: .
    environment: &mevad-environment
      MEVAD_API_HOST: 0.0.0.0
      MEVAD_ENVIRONMENT: ${MEVAD_ENVIRONMENT:-development}
      MEVAD_API_DOCS_ENABLED: ${MEVAD_API_DOCS_ENABLED:-true}
      MEVAD_DATABASE_URL: postgresql+psycopg://mevad:${MEVAD_POSTGRES_PASSWORD:-mevad}@postgres:5432/mevad
      MEVAD_JOB_BACKEND: postgres
      MEVAD_QUEUE_BACKEND: redis
      MEVAD_REDIS_URL: redis://redis:6379/0
      MEVAD_REQUIRE_MEDIA_TOOLS: "false"
      MEVAD_STORAGE_ROOT: /app/storage/jobs
      MEVAD_ANALYZER_ENABLED: "true"
      MEVAD_NETWORK_SANDBOX: external_proxy
      MEVAD_MEDIA_PROXY_URL: http://egress-proxy:3128
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - job-storage:/app/storage/jobs
    networks:
      - backend

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mevad.app}
        NEXT_PUBLIC_MEVAD_TELEMETRY_ENABLED: ${NEXT_PUBLIC_MEVAD_TELEMETRY_ENABLED:-false}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}
    environment:
      MEVAD_API_INTERNAL_URL: http://api:8000
      MEVAD_TELEMETRY_MODE: ${MEVAD_TELEMETRY_MODE:-off}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - backend
      - frontend

  worker:
    build: .
    command: ["mevad-worker"]
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 256
    environment: *mevad-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - job-storage:/app/storage/jobs
    networks:
      - backend

  outbox:
    build: .
    command: ["mevad-outbox"]
    environment: *mevad-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  cleanup:
    build: .
    command: ["mevad-cleanup"]
    environment: *mevad-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - job-storage:/app/storage/jobs
    networks:
      - backend

volumes:
  job-storage:
  postgres-data:
  redis-data:

networks:
  backend:
    internal: true
  frontend:
  egress:
