services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mevad
      POSTGRES_USER: mevad
      POSTGRES_PASSWORD: mevad
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mevad -d mevad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - backend

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    volumes:
      - ./deploy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - backend
      - egress

  migrate:
    build: .
    command: ["mevad-migrate"]
    environment:
      MEVAD_DATABASE_URL: postgresql+psycopg://mevad:mevad@postgres:5432/mevad
      MEVAD_REQUIRE_MEDIA_TOOLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build: .
    environment: &mevad-environment
      MEVAD_API_HOST: 0.0.0.0
      MEVAD_DATABASE_URL: postgresql+psycopg://mevad:mevad@postgres:5432/mevad
      MEVAD_JOB_BACKEND: postgres
      MEVAD_QUEUE_BACKEND: redis
      MEVAD_REDIS_URL: redis://redis:6379/0
      MEVAD_REQUIRE_MEDIA_TOOLS: "false"
      MEVAD_STORAGE_ROOT: /app/storage/jobs
      MEVAD_ANALYZER_ENABLED: "true"
      MEVAD_NETWORK_SANDBOX: external_proxy
      MEVAD_MEDIA_PROXY_URL: http://egress-proxy:3128
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - job-storage:/app/storage/jobs
    networks:
      - backend

  web:
    build:
      context: ./apps/web
    environment:
      MEVAD_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - backend
      - frontend

  worker:
    build: .
    command: ["mevad-worker"]
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 256
    environment: *mevad-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - job-storage:/app/storage/jobs
    networks:
      - backend

  outbox:
    build: .
    command: ["mevad-outbox"]
    environment: *mevad-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  cleanup:
    build: .
    command: ["mevad-cleanup"]
    environment: *mevad-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - job-storage:/app/storage/jobs
    networks:
      - backend

volumes:
  job-storage:
  postgres-data:
  redis-data:

networks:
  backend:
    internal: true
  frontend:
  egress:
