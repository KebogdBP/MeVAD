[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mevad"
version = "0.1.0"
description = "Media analysis and processing core for MegaDownloader Video & Audio"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KebogdBP" }]
dependencies = [
  "yt-dlp[default]==2026.6.9",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pre-commit==4.2.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[project.scripts]
mevad = "mevad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mevad"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
