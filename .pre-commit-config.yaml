repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        args: [src, tests]
        additional_dependencies:
          - fastapi==0.140.0
          - httpx2==2.7.0
          - pydantic-settings==2.14.2
          - pytest==8.4.1
          - redis==8.0.1
          - SQLAlchemy==2.0.51
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest
        language: system
        pass_filenames: false
