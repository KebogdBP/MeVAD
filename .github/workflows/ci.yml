name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose overlay
        env:
          MEVAD_DOMAIN: mevad.example.com
          NEXT_PUBLIC_SITE_URL: https://mevad.example.com
          MEVAD_POSTGRES_PASSWORD: ci-only-password
          MEVAD_DATABASE_URL: postgresql+psycopg://mevad:ci-only-password@postgres:5432/mevad
          MEVAD_ABUSE_CLIENT_SALT: ci-only-abuse-client-salt-32-chars
        run: docker compose -f compose.yaml -f compose.production.yaml config --quiet

      - name: Validate Caddy ingress
        run: >-
          docker run --rm
          -e MEVAD_DOMAIN=mevad.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine
          caddy validate --config /etc/caddy/Caddyfile

  backend-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest --cov=mevad --cov=mevad_api --cov=mevad_worker --cov-report=term-missing

      - name: CLI smoke test
        run: mevad --version

  web-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Design-token policy
        run: npm run lint:tokens

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Storybook browser
        run: npx playwright install --with-deps chromium

      - name: Storybook build
        run: npm run build:storybook

      - name: Storybook accessibility tests
        run: npm run test:storybook

      - name: Production build
        run: npm run build

      - name: Lighthouse release audit
        run: npm run test:release
